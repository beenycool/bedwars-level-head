name: Keep backend warm

# Render's free instances unload after ~15 minutes idle, and the mod's HTTP timeout
# is 15s, so the first lookup after a quiet spell fails and has to back off. This
# pings the cheap /ping endpoint often enough to keep the instance loaded.
#
# /ping does no work on purpose: no database query and no Hypixel call. Do not point
# this at /healthz, which probes both on every request.

on:
  schedule:
    # GitHub's scheduler can drift by several minutes under load, so stay well
    # inside the 15 minute idle window rather than exactly on it.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
              https://bedwars-level-head.onrender.com/ping || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "backend did not answer with 200" >&2
          exit 1
